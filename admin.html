<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BlueGame | پنل مدیریت</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .admin-page {
      max-width: 1200px;
      margin: auto;
      padding: 50px 20px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .admin-header h1 {
      font-size: 40px;
    }

    .admin-header h1 span {
      color: var(--blue);
    }

    .admin-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .admin-box h2 {
      margin-bottom: 20px;
    }

    .admin-form {
      display: grid;
      gap: 12px;
    }

    .admin-form input,
    .admin-form textarea,
    .admin-form select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #080f18;
      color: white;
      outline: none;
      font-family: inherit;
    }

    .admin-form textarea {
      min-height: 100px;
      resize: vertical;
    }

    .admin-form button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .admin-items {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .admin-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 16px;
      border-radius: 15px;
      background: #080f18;
      border: 1px solid var(--border);
    }

    .admin-item-info h3 {
      margin-bottom: 4px;
    }

    .admin-item-info p {
      color: var(--muted);
      font-size: 14px;
    }

    .delete-btn {
      background: #e53935;
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
    }

    .logout-btn {
      background: #111b28;
      color: white;
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
    }

    .back-btn {
      display: inline-block;
      color: var(--blue);
      margin-bottom: 25px;
    }

    .hidden {
      display: none !important;
    }

    .login-box {
      max-width: 450px;
      margin: 100px auto;
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-box h1 span {
      color: var(--blue);
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    .message.success {
      display: block;
      background: rgba(46, 204, 113, .1);
      color: #2ecc71;
    }

    .message.error {
      display: block;
      background: rgba(231, 76, 60, .1);
      color: #ff6b5f;
    }

    @media (max-width: 700px) {

      .admin-header h1 {
        font-size: 30px;
      }

      .admin-item {
        flex-direction: column;
        align-items: stretch;
      }

    }

  </style>

</head>


<body>


<!-- LOGIN -->

<section id="loginSection" class="admin-page">

  <div class="admin-box login-box">

    <h1>
      پنل <span>BlueGame</span>
    </h1>

    <form id="loginForm" class="admin-form">

      <input
        type="text"
        id="username"
        placeholder="نام کاربری"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="رمز عبور"
        required
      >

      <button
        type="submit"
        class="btn blue"
      >
        ورود به پنل
      </button>

    </form>

    <div id="loginMessage" class="message"></div>

  </div>

</section>



<!-- ADMIN PANEL -->

<section id="adminSection" class="admin-page hidden">

  <div class="admin-header">

    <div>

      <a
        href="index.html"
        class="back-btn"
      >
        ← بازگشت به سایت
      </a>

      <h1>
        پنل <span>مدیریت</span></h1>

    </div>


    <button
      id="logoutBtn"
      class="logout-btn"
    >
      خروج
    </button>

  </div>



  <!-- ADD GAME -->

  <div class="admin-box">

    <h2>🎮 افزودن بازی</h2>

    <form id="gameForm" class="admin-form">

      <input
        type="text"
        id="gameTitle"
        placeholder="نام بازی"
        required
      >

      <textarea
        id="gameDescription"
        placeholder="توضیحات بازی"
        required
      ></textarea>

      <input
        type="text"
        id="gameVersion"
        placeholder="نسخه"
      >

      <input
        type="text"
        id="gameSize"
        placeholder="حجم بازی"
      >

      <input
        type="url"
        id="gameImage"
        placeholder="لینک تصویر بازی (اختیاری)"
      >

      <input
        type="url"
        id="gameDownload"
        placeholder="لینک دانلود"
        required
      >

      <button
        type="submit"
        class="btn blue"
      >
        + افزودن بازی
      </button>

    </form>

    <div id="gamesAdminList" class="admin-items"></div>

  </div>



  <!-- ADD MOD -->

  <div class="admin-box">

    <h2>🧩 افزودن مود</h2>

    <form id="modForm" class="admin-form">

      <input
        type="text"
        id="modTitle"
        placeholder="نام مود"
        required
      >

      <textarea
        id="modDescription"
        placeholder="توضیحات مود"
        required
      ></textarea>

      <select id="modType">

        <option value="java">
          Minecraft Java
        </option>

        <option value="bedrock">
          Minecraft Bedrock
        </option>

      </select>

      <input
        type="text"
        id="modVersion"
        placeholder="نسخه Minecraft"
      >

      <input
        type="text"
        id="modLoader"
        placeholder="Loader مثل Fabric یا Forge"
      >

      <input
        type="url"
        id="modImage"
        placeholder="لینک تصویر مود (اختیاری)"
      >

      <input
        type="url"
        id="modDownload"
        placeholder="لینک دانلود مود"
        required
      >

      <button
        type="submit"
        class="btn blue"
      >
        + افزودن مود
      </button>

    </form>

    <div id="modsAdminList" class="admin-items"></div>

  </div>



  <!-- ADD NEWS -->

  <div class="admin-box">

    <h2>📰 افزودن خبر</h2>

    <form id="newsForm" class="admin-form">

      <input
        type="text"
        id="newsTitle"
        placeholder="عنوان خبر"
        required
      >

      <textarea
        id="newsDescription"
        placeholder="متن خبر"
        required
      ></textarea>

      <input
        type="text"
        id="newsDate"
        placeholder="تاریخ یا زمان انتشار"
      >

      <button
        type="submit"
        class="btn blue"
      >
        + انتشار خبر
      </button>

    </form>

    <div id="newsAdminList" class="admin-items"></div>

  </div>

</section>



<script src="admin.js"></script>

</body>

</html>
